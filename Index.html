<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Snake Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }
        
        #gameCanvas {
            border: 4px solid #4ade80;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.3);
        }
        
        .glow-text {
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.8);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">
    <div class="text-center mb-6">
        <h1 class="text-5xl font-bold text-green-400 glow-text mb-2">🐍 Snake Game</h1>
        <p class="text-gray-400">Use Arrow Keys or WASD to move</p>
    </div>
    
    <div class="flex gap-8 mb-4">
        <div class="bg-gray-800/50 px-6 py-3 rounded-lg border border-gray-700">
            <span class="text-gray-400">Score: </span>
            <span id="score" class="text-2xl font-bold text-green-400">0</span>
        </div>
        <div class="bg-gray-800/50 px-6 py-3 rounded-lg border border-gray-700">
            <span class="text-gray-400">High Score: </span>
            <span id="highScore" class="text-2xl font-bold text-yellow-400">0</span>
        </div>
        <div class="bg-gray-800/50 px-6 py-3 rounded-lg border border-gray-700">
            <span class="text-gray-400">Speed: </span>
            <span id="speed" class="text-2xl font-bold text-blue-400">1</span>
        </div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <!-- Start Screen -->
    <div id="startScreen" class="fixed inset-0 bg-black/80 flex items-center justify-center z-10">
        <div class="bg-gray-900 p-10 rounded-2xl border-2 border-green-500 text-center fade-in">
            <h2 class="text-4xl font-bold text-green-400 glow-text mb-6">🐍 Snake Game</h2>
            <p class="text-gray-300 mb-4">Eat the red apples to grow!</p>
            <p class="text-gray-400 mb-6 text-sm">Controls: Arrow Keys or WASD</p>
            <button id="startBtn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-lg text-xl transition-all hover:scale-105 pulse-animation">
                Start Game
            </button>
        </div>
    </div>
    
    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="fixed inset-0 bg-black/80 flex items-center justify-center z-10 hidden">
        <div class="bg-gray-900 p-10 rounded-2xl border-2 border-red-500 text-center fade-in">
            <h2 class="text-4xl font-bold text-red-400 mb-4">💀 Game Over!</h2>
            <p class="text-gray-300 mb-2">Your Score</p>
            <p id="finalScore" class="text-5xl font-bold text-green-400 glow-text mb-4">0</p>
            <p id="newHighScore" class="text-yellow-400 text-xl mb-6 hidden">🎉 New High Score!</p>
            <button id="restartBtn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-lg text-xl transition-all hover:scale-105">
                Play Again
            </button>
        </div>
    </div>
    
    <div class="mt-4 text-gray-500 text-sm">
        Press <kbd class="bg-gray-700 px-2 py-1 rounded">Space</kbd> to pause
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game constants
        const GRID_SIZE = 20;
        const CELL_COUNT = canvas.width / GRID_SIZE;
        const BASE_SPEED = 150;
        const SPEED_INCREMENT = 10;
        const SCORE_PER_SPEED = 5;
        
        // Game state
        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = { x: 0, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop = null;
        let isGameRunning = false;
        let isPaused = false;
        let currentSpeed = BASE_SPEED;
        let speedLevel = 1;
        
        // Smooth animation
        let lastRenderTime = 0;
        let animationProgress = 0;
        
        // DOM elements
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const speedEl = document.getElementById('speed');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreEl = document.getElementById('finalScore');
        const newHighScoreEl = document.getElementById('newHighScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        
        // Initialize high score display
        highScoreEl.textContent = highScore;
        
        // Initialize game
        function initGame() {
            // Start snake in the middle
            const startX = Math.floor(CELL_COUNT / 2);
            const startY = Math.floor(CELL_COUNT / 2);
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY }
            ];
            
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            currentSpeed = BASE_SPEED;
            speedLevel = 1;
            isPaused = false;
            
            scoreEl.textContent = score;
            speedEl.textContent = speedLevel;
            
            spawnFood();
        }
        
        // Spawn food at random position
        function spawnFood() {
            let validPosition = false;
            while (!validPosition) {
                food = {
                    x: Math.floor(Math.random() * CELL_COUNT),
                    y: Math.floor(Math.random() * CELL_COUNT)
                };
                
                // Make sure food doesn't spawn on snake
                validPosition = !snake.some(segment => 
                    segment.x === food.x && segment.y === food.y
                );
            }
        }
        
        // Update game state
        function update() {
            if (isPaused) return;
            
            // Update direction
            direction = { ...nextDirection };
            
            // Calculate new head position
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };
            
            // Check wall collision
            if (head.x < 0 || head.x >= CELL_COUNT || head.y < 0 || head.y >= CELL_COUNT) {
                gameOver();
                return;
            }
            
            // Check self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }
            
            // Add new head
            snake.unshift(head);
            
            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                
                // Increase speed every SCORE_PER_SPEED points
                if (score % (SCORE_PER_SPEED * 10) === 0) {
                    speedLevel++;
                    speedEl.textContent = speedLevel;
                    currentSpeed = Math.max(50, BASE_SPEED - (speedLevel - 1) * SPEED_INCREMENT);
                    
                    // Restart game loop with new speed
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, currentSpeed);
                }
                
                spawnFood();
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }
        }
        
        // Draw game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = '#2d2d44';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= CELL_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }
            
            // Draw food (apple)
            const foodX = food.x * GRID_SIZE + GRID_SIZE / 2;
            const foodY = food.y * GRID_SIZE + GRID_SIZE / 2;
            
            // Apple body
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(foodX, foodY, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Apple shine
            ctx.fillStyle = '#fca5a5';
            ctx.beginPath();
            ctx.arc(foodX - 3, foodY - 3, 4, 0, Math.PI * 2);
            ctx.fill();
            
            // Apple stem
            ctx.fillStyle = '#65a30d';
            ctx.fillRect(foodX - 1, foodY - GRID_SIZE / 2, 3, 5);
            
            // Draw snake
            snake.forEach((segment, index) => {
                const x = segment.x * GRID_SIZE;
                const y = segment.y * GRID_SIZE;
                
                // Gradient from head to tail
                const hue = 120;
                const lightness = 50 - (index / snake.length) * 20;
                ctx.fillStyle = `hsl(${hue}, 70%, ${lightness}%)`;
                
                // Draw rounded rectangle for each segment
                const padding = 1;
                const radius = 5;
                
                ctx.beginPath();
                ctx.roundRect(
                    x + padding,
                    y + padding,
                    GRID_SIZE - padding * 2,
                    GRID_SIZE - padding * 2,
                    radius
                );
                ctx.fill();
                
                // Draw eyes on head
                if (index === 0) {
                    ctx.fillStyle = 'white';
                    const eyeSize = 4;
                    const eyeOffset = 5;
                    
                    let eye1X, eye1Y, eye2X, eye2Y;
                    
                    if (direction.x === 1) { // Right
                        eye1X = x + GRID_SIZE - 6;
                        eye1Y = y + 6;
                        eye2X = x + GRID_SIZE - 6;
                        eye2Y = y + GRID_SIZE - 6;
                    } else if (direction.x === -1) { // Left
                        eye1X = x + 6;
                        eye1Y = y + 6;
                        eye2X = x + 6;
                        eye2Y = y + GRID_SIZE - 6;
                    } else if (direction.y === -1) { // Up
                        eye1X = x + 6;
                        eye1Y = y + 6;
                        eye2X = x + GRID_SIZE - 6;
                        eye2Y = y + 6;
                    } else { // Down
                        eye1X = x + 6;
                        eye1Y = y + GRID_SIZE - 6;
                        eye2X = x + GRID_SIZE - 6;
                        eye2Y = y + GRID_SIZE - 6;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Pupils
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(eye1X + direction.x, eye1Y + direction.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eye2X + direction.x, eye2Y + direction.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            // Draw pause overlay
            if (isPaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
                ctx.font = '24px Arial';
                ctx.fillText('Press Space to continue', canvas.width / 2, canvas.height / 2 + 40);
            }
        }
        
        // Animation loop
        function gameRender(currentTime) {
            if (!isGameRunning) return;
            
            draw();
            requestAnimationFrame(gameRender);
        }
        
        // Game over
        function gameOver() {
            isGameRunning = false;
            clearInterval(gameLoop);
            
            finalScoreEl.textContent = score;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = highScore;
                newHighScoreEl.classList.remove('hidden');
            } else {
                newHighScoreEl.classList.add('hidden');
            }
            
            gameOverScreen.classList.remove('hidden');
        }
        
        // Start game
        function startGame() {
            initGame();
            isGameRunning = true;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            gameLoop = setInterval(update, currentSpeed);
            requestAnimationFrame(gameRender);
        }
        
        // Event listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        
        document.addEventListener('keydown', (e) => {
            // Prevent default for arrow keys
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }
            
            // Pause toggle
            if (e.code === 'Space' && isGameRunning) {
                isPaused = !isPaused;
                return;
            }
            
            if (isPaused) return;
            
            // Direction controls
            switch (e.code) {
                case 'ArrowUp':
                case 'KeyW':
                    if (direction.y !== 1) {
                        nextDirection = { x: 0, y: -1 };
                    }
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    if (direction.y !== -1) {
                        nextDirection = { x: 0, y: 1 };
                    }
                    break;
                case 'ArrowLeft':
                case 'KeyA':
                    if (direction.x !== 1) {
                        nextDirection = { x: -1, y: 0 };
                    }
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    if (direction.x !== -1) {
                        nextDirection = { x: 1, y: 0 };
                    }
                    break;
            }
        });
        
        // Touch controls for mobile
        let touchStartX = 0;
        let touchStartY = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        
        canvas.addEventListener('touchend', (e) => {
            if (isPaused) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal swipe
                if (dx > 0 && direction.x !== -1) {
                    nextDirection = { x: 1, y: 0 };
                } else if (dx < 0 && direction.x !== 1) {
                    nextDirection = { x: -1, y: 0 };
                }
            } else {
                // Vertical swipe
                if (dy > 0 && direction.y !== -1) {
                    nextDirection = { x: 0, y: 1 };
                } else if (dy < 0 && direction.y !== 1) {
                    nextDirection = { x: 0, y: -1 };
                }
            }
        });
        
        // Initial draw
        initGame();
        draw();
    </script>
</body>
</html>
